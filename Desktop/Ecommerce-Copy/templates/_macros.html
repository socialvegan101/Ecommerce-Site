{# Shared SVG icons (same set as the design): {{ icon('arrow') }} #}
{% macro icon(name, size=20) -%}
<svg aria-hidden="true" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
{%- if name == 'arrow' %}<path d="M5 12h14m-5-5 5 5-5 5"/>
{%- elif name == 'bag' %}<path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>
{%- elif name == 'menu' %}<path d="M4 8h16M4 16h16"/>
{%- elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
{%- elif name == 'mail' %}<rect x="3" y="5" width="18" height="14" rx="1"/><path d="m4 7 8 6 8-6"/>
{%- elif name == 'phone' %}<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1Z"/>
{%- elif name == 'pin' %}<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{%- endif %}</svg>
{%- endmacro %}
